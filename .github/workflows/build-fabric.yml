name: Build HeroBot (Fabric 26.3)

on:
  push:
    branches: [port-26.3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x gradlew
          ./gradlew :herobot-mod:build --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: herobot-fabric-26.3
          path: herobot-mod/build/libs/*.jar
